<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}OAuth2 邮箱管理{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="logo">OAuth2 邮箱管理器</a>
            <div class="nav-links">
                <a href="/">账号列表</a>
                <a href="/import">导入账号</a>
                <a href="/tokens">令牌状态</a>
                <a href="/settings">设置</a>
                <form method="post" action="/logout" class="nav-logout">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button type="submit" class="nav-link-danger">退出</button>
                </form>
            </div>
            <div id="version-widget" class="version-widget" title="版本更新状态">
                <span class="version-current">v{{ current_version }}</span>
                <span class="version-status">检查中...</span>
                <button type="button" class="version-update" hidden>更新</button>
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
