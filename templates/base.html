<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OAuth2 邮箱管理{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="logo">📧 OAuth2 邮箱管理器</a>
            <div class="nav-links">
                <a href="/">账号列表</a>
                <a href="/import">导入账号</a>
                <a href="/tokens">令牌状态</a>
                <a href="/settings">设置</a>
                <a href="/logout" style="color: #f44336;">退出</a>
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        async function fetchAccount(id, btn) {
            btn.disabled = true; btn.textContent = '取件中...';
            try {
                const r = await fetch(`/fetch/${id}`, {method:'POST'});
                const d = await r.json();
                if (d.ok) {
                    alert(d.fetched > 0
                        ? `取件完成：新增 ${d.fetched} 封邮件，点击邮箱地址即可查看`
                        : '取件完成：没有新邮件（邮箱内容已是最新）');
                } else {
                    alert('取件失败：' + (d.error || '未知错误'));
                }
            } catch(e) { alert('取件出错：' + e); }
            location.reload();
        }
        async function fetchAll(btn) {
            btn.disabled = true; btn.textContent = '批量取件中...';
            try {
                const r = await fetch('/fetch-all', {method:'POST'});
                const d = await r.json();
                alert(`批量取件完成\n成功: ${d.success} 个账号, 失败: ${d.failed} 个, 新增邮件: ${d.total_emails} 封` +
                      (d.failed > 0 ? '\n失败原因见列表「最后错误」列' : ''));
            } catch(e) { alert('批量取件出错：' + e); }
            location.reload();
        }
        async function checkAll(btn) {
            btn.disabled = true; btn.textContent = '检测中...';
            try {
                const r = await fetch('/check-all', {method:'POST'});
                const d = await r.json();
                alert(`健康检测完成\n✅ 可用: ${d.success} 个, ❌ 异常: ${d.failed} 个` +
                      (d.failed > 0 ? '\n点击统计栏「异常」数字查看失败原因' : ''));
            } catch(e) { alert('检测出错：' + e); }
            location.reload();
        }
        async function setFetchMode(id, mode, sel) {
            try {
                const fd = new FormData();
                fd.append('fetch_mode', mode);
                const r = await fetch(`/account/${id}/prefs`, {method:'POST', body: fd});
                const d = await r.json();
                if (!d.ok) { alert('切换失败'); sel.value = sel.dataset.prev; return; }
                sel.dataset.prev = mode;
            } catch(e) { alert('切换出错：' + e); sel.value = sel.dataset.prev; }
        }
    </script>
</body>
</html>
