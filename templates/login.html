<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Mail Manager</title>
    <link rel="stylesheet" href="/static/style.css?v={{ current_version }}">
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="login-brand">
            <span class="brand-mark" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <div>
                <div class="login-title">Mail Manager</div>
                <div class="login-sub">OAuth2 邮箱账号管理平台</div>
            </div>
        </div>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        {% if changed %}
        <div class="alert alert-success">密码已修改，请使用新密码重新登录</div>
        {% endif %}

        <form method="post" action="/login">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required autofocus placeholder="admin" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">登 录</button>
        </form>
    </div>
</div>
</body>
</html>
