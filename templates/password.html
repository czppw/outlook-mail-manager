{% extends "base.html" %}
{% block title %}修改密码 - Mail Manager{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>修改密码</h1>
        <p class="page-sub">修改后所有已登录会话将失效，需要重新登录</p>
    </div>
</div>

<div class="card" style="max-width: 440px;">
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="alert alert-success">{{ success }}</div>
    {% endif %}

    <form method="post" action="/password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label>旧密码</label>
            <input type="password" name="old_password" required autocomplete="current-password">
        </div>
        <div class="form-group">
            <label>新密码（至少 8 位，包含字母和数字）</label>
            <input type="password" name="new_password" required minlength="8"
                   pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">修改密码</button>
    </form>
</div>
{% endblock %}
