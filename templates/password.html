{% extends "base.html" %}
{% block title %}修改密码 - Mail Manager{% endblock %}
{% block content %}
<div class="page-head">
    <div class="page-title-group">
        <h1>修改管理员密码</h1>
        <p class="page-sub">密码更新后，所有现存的登录会话将全部作废，需重新登录验证</p>
    </div>
    <div class="page-actions">
        <a href="/settings" class="btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            返回设置
        </a>
    </div>
</div>

<div class="card" style="max-width: 480px;">
    {% if error %}
    <div class="alert alert-error">
        <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span>{{ error }}</span>
    </div>
    {% endif %}
    {% if success %}
    <div class="alert alert-success">
        <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        <span>{{ success }}</span>
    </div>
    {% endif %}

    <form method="post" action="/password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label>原密码</label>
            <input type="password" name="old_password" required placeholder="请输入当前管理员密码" autocomplete="current-password">
        </div>
        <div class="form-group">
            <label>新密码（至少 8 位，包含字母与数字）</label>
            <input type="password" name="new_password" required minlength="8"
                   pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" placeholder="请输入复杂度符合要求的新密码" autocomplete="new-password">
            <p class="hint">建议使用强随机密码，修改成功后将跳转至登录页重新登入。</p>
        </div>
        <div style="margin-top: 24px;">
            <button type="submit" class="btn btn-primary btn-block">确认修改并注销当前会话</button>
        </div>
    </form>
</div>
{% endblock %}
